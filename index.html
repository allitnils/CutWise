<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wood Cut Optimiser</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="app-shell">

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header>
    <h1>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px;margin-right:8px;color:#c45c1a">
        <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
      </svg>
      Wood Cut Optimiser
    </h1>
    <span class="version">v1.0</span>
  </header>

  <div class="main">

    <!-- ── Sidebar ──────────────────────────────────────────────────────── -->
    <aside class="sidebar">
      <div class="sidebar-inner">

        <!-- Sheet config -->
        <div class="card">
          <div class="card-title">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
            Sheet configuration
          </div>
          <div style="display:flex;flex-direction:column;gap:10px">
            <div class="field-row field-row-2">
              <div>
                <label>Width (mm)</label>
                <input type="number" id="sw" value="2440" min="1">
              </div>
              <div>
                <label>Height (mm)</label>
                <input type="number" id="sh" value="1220" min="1">
              </div>
            </div>
            <div>
              <label>Kerf (mm)</label>
              <input type="number" id="kerf" value="3" min="0" max="20" style="width:120px">
            </div>
            <div class="toggle-row">
              <span class="toggle-label">Respect grain direction</span>
              <label class="toggle">
                <input type="checkbox" id="grain">
                <span class="toggle-track"></span>
              </label>
            </div>
          </div>
        </div>

        <!-- CSV import -->
        <div class="card">
          <div class="card-title">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Import CSV
          </div>
          <div id="drop-zone" class="drop-zone">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--text3);margin-bottom:8px">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <div class="drop-zone-text">
              <strong>Click to browse</strong> or drag &amp; drop<br>
              a .csv file here
            </div>
          </div>
          <input type="file" id="csv-input" accept=".csv">
          <button class="btn-ghost" onclick="downloadSampleCSV()" style="margin-top:8px;width:100%">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download sample CSV
          </button>
        </div>

        <!-- Cut list -->
        <div class="card">
          <div class="card-title">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            Cut list
          </div>

          <!-- Column headers -->
          <div style="display:grid;grid-template-columns:2fr 72px 72px 60px 32px;gap:6px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--border)">
            <span style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)">Name</span>
            <span style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)">W</span>
            <span style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)">H</span>
            <span style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)">Qty</span>
            <span></span>
          </div>

          <div id="cut-rows"></div>

          <button class="btn-ghost" onclick="addCut()" style="margin-top:10px;width:100%">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add piece
          </button>
        </div>

      </div><!-- /sidebar-inner -->

      <!-- Optimise button -->
      <div class="sidebar-footer">
        <button class="btn-primary" onclick="optimise()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          Optimise layout
        </button>
      </div>
    </aside>

    <!-- ── Content area ──────────────────────────────────────────────────── -->
    <main class="content">

      <!-- Metrics + actions bar -->
      <div class="content-header">
        <div class="metrics-bar">
          <div class="metric">
            <div class="metric-val" id="m-sheets">—</div>
            <div class="metric-lbl">Sheets needed</div>
          </div>
          <div class="metric-divider"></div>
          <div class="metric">
            <div class="metric-val" id="m-cuts">—</div>
            <div class="metric-lbl">Total pieces</div>
          </div>
          <div class="metric-divider"></div>
          <div class="metric">
            <div class="metric-val">
              <span id="util-badge" class="util-badge">—</span>
            </div>
            <div class="metric-lbl">Utilisation</div>
          </div>
          <div class="metric-divider"></div>
          <div class="metric">
            <div class="metric-val" id="m-waste">—</div>
            <div class="metric-lbl">Waste</div>
          </div>
        </div>
        <div class="content-actions">
          <button class="btn-ghost" onclick="exportPDF()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 15h6M9 11h6M9 19h4"/></svg>
            Export PDF
          </button>
          <button class="btn-ghost" onclick="exportDXF()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12h8M12 8v8"/></svg>
            Export DXF
          </button>
        </div>
      </div>

      <!-- Sheet tabs -->
      <div class="sheet-tabs" id="sheet-tabs"></div>

      <!-- Results / empty state -->
      <div id="empty-state" class="empty-state">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M3 9h18M9 21V9"/>
        </svg>
        <h2>No layout yet</h2>
        <p>Add your cut sizes in the panel on the left, then hit <strong>Optimise layout</strong>.</p>
      </div>

      <div id="results-area" style="display:none;flex-direction:column;flex:1;overflow:hidden">
        <div class="canvas-area">
          <div class="canvas-wrap">
            <canvas id="layout-canvas"></canvas>
          </div>
        </div>
        <div class="legend" id="legend"></div>
      </div>

    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
